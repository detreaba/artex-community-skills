server {
    listen 80;
    # streaming front for the fpm pair; body forwarded as fastcgi records
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass fpm:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/index.php;
    }
    location / { try_files $uri $uri/ =404; }
}
